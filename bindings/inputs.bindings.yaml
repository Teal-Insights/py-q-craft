- id: discrete_revenue_shocks
  sheet: Discrete Risks
  data_range: Discrete Risks!C2:BT13
  layout: matrix
  exclude_rows:
  - 3
  - 5
  - 7
  - 9
  - 11
  - 13
  input: {}
  domain:
    real_between: *id001
  structure:
    measure:
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - id: SCENARIO
      concept: SCENARIO
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: A
        fill: true
        read: string
    - id: TIME_PERIOD
      concept: TIME_PERIOD
      role: key
      scope: cell
      bind:
        kind: column_header
        header_row: 1
        read: int
  key:
  - SCENARIO
  - TIME_PERIOD
  groups:
  - path:
    - discrete_risks
    order: 1
  notes: 'Grouped-row matrix: scenario band labels in column A fill down to paired
    primary-expenditure rows; exclude_rows selects revenue or expenditure shock paths
    within the interleaved band layout.'
- id: discrete_primary_expenditure_shocks
  sheet: Discrete Risks
