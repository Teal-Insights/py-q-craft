schema_version: 1.22.0
concept_scheme:
  id: qcraft_model
  concepts:
  - id: OBS_VALUE
    name: Observation value
    dtype: number
  - id: TIME_PERIOD
    name: Time period
    dtype: int
  - id: UNIT_MEASURE
    name: Unit of measure
    dtype: string
  - id: SCENARIO
    name: Climate scenario
    dtype: string
  - id: COUNTRY
    name: Country
    dtype: string
  - id: INDICATOR
    name: Macro-fiscal indicator
    dtype: string
  - id: PARAMETER
    name: Model parameter
    dtype: string
  - id: SHOCK_PARAMETER
    name: Discrete shock parameter
    dtype: string
  - id: DEMOGRAPHY_VARIANT
    name: Demographic projection variant
    dtype: string
  - id: FISCAL_MEASURE
    name: Debt-stabilising primary balance table measure (PB, PB*, PB Gap)
    dtype: string
series:
- id: baseline_engine_working_age_population
  sheet: Baseline
  data_range: Baseline!P5:CP5
  layout: series
  internal: {}
  structure:
    measure:
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - id: TIME_PERIOD
      concept: TIME_PERIOD
      role: key
      scope: cell
      bind:
        kind: column_header
        header_row: 2
        read: int
    attributes:
    - id: UNIT_MEASURE
      concept: UNIT_MEASURE
      role: attribute
      value: PERSONS_THS
      include_in_record: true
  key:
  - TIME_PERIOD
  series_context:
    INDICATOR: Working age (15-64) population
  validation:
    warn_on_partial_overlap: false
